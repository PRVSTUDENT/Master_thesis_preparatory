<text x="880.0" y="470" text-anchor="middle" font-size="18" font-family="Arial" font-weight="bold">State variables</text>
<text x="880.0" y="495" text-anchor="middle" font-size="15" font-family="Arial">SDV1 = p, SDV15 = Δp</text>
<line x1="880" y1="215" x2="880" y2="240" stroke="#333" stroke-width="2.5" marker-end="url(#arrow-black)"/>
<line x1="880" y1="315" x2="880" y2="340" stroke="#333" stroke-width="2.5" marker-end="url(#arrow-black)"/>
<line x1="880" y1="415" x2="880" y2="440" stroke="#333" stroke-width="2.5" marker-end="url(#arrow-black)"/>
